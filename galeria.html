<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>RCG LIVE VIEWER PRO</title>

<style>
body {
  margin: 0;
  background: black;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
}


.viewer {
  width: 40vh;
  height: 71vh; /* 9:16 */
  background: #000;
  overflow: hidden;
  margin-bottom: 30px;
}

.viewer img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}


.dock {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 15px 25px;
  background: rgba(255,255,255,0.05);
  border-radius: 25px;
  backdrop-filter: blur(15px);
}


.thumb {
  width: 60px;
  height: 100px;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.15s ease;
}
</style>
</head>

<body>

<div class="viewer">
  <img id="mainImg">
</div>

<div class="dock" id="dock"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabaseUrl = 'https://popjngffydbagaebzueq.supabase.co';
const supabaseKey = 'sb_publishable_hHy6tbYKnped4Z810lF2Kg_iSasCoe0';

const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

let imagenActual = "";
let thumbs = [];

async function cargarGaleria() {
  const { data } = await supabaseClient.storage
    .from('selfies')
    .list('', { 
      limit: 20, 
      sortBy: { column: 'created_at', order: 'desc' } 
    });

  if (!data) return;

  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  thumbs = [];

  data.forEach((file, index) => {
    const { data: urlData } = supabaseClient.storage
      .from('selfies')
      .getPublicUrl(file.name);

    const url = urlData.publicUrl;

    const img = document.createElement('img');
    img.src = url;
    img.classList.add('thumb');

    img.onclick = () => {
      document.getElementById('mainImg').src = url;
      imagenActual = url;
    };

    dock.appendChild(img);
    thumbs.push(img);

    // imagen inicial
    if (index === 0 && imagenActual === "") {
      document.getElementById('mainImg').src = url;
      imagenActual = url;
    }
  });
}


document.addEventListener('mousemove', (e) => {
  thumbs.forEach(img => {
    const rect = img.getBoundingClientRect();
    const center = rect.left + rect.width / 2;

    const distance = Math.abs(e.clientX - center);

    const maxDist = 150; // rango de efecto
    let scale = 1;

    if (distance < maxDist) {
      scale = 1 + (1 - distance / maxDist) * 1.2;
    }

    img.style.transform = `scale(${scale})`;
  });
});


document.querySelector('.dock').addEventListener('mouseleave', () => {
  thumbs.forEach(img => {
    img.style.transform = 'scale(1)';
  });
});


setInterval(cargarGaleria, 5000);

cargarGaleria();
</script>

</body>
</html>
